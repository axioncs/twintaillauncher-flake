name: Check for TwintailLauncher updates

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run update script
        id: update
        run: |
          set -e
          before=$(jq -r '.version' version.json)
          ./update.sh
          after=$(jq -r '.version' version.json)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build (x86_64-linux)
        if: steps.update.outputs.changed == 'true'
        run: nix build .#default --print-build-logs

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump TwintailLauncher to v${{ steps.update.outputs.new_version }}"
          git push
